<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario de guardias</title>
<style>
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#0b0e13;font-weight:600}
button.pri:hover{filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:default}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
@media (max-width:1150px){.layout{grid-template-columns:1fr}}
.doc{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px;margin-top:8px;background:var(--cell)}
.docname{display:flex;align-items:center;gap:6px}
.docname input{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;width:100%;min-width:0;font-weight:600}
.docname input:hover,.docname input:focus{border-color:var(--line);background:var(--card)}
.hoy{font-size:11px;color:var(--mute);margin-top:5px}
.hoy.bad{color:var(--warn)}
.hb{height:4px;border-radius:2px;background:var(--c);margin-top:5px;opacity:.9}
.qsum{font-size:12px;color:var(--mute);margin:6px 0}
.qsum b{color:var(--ink)}
.rules{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:8px;background:var(--cell);padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.frm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frm.col{flex-direction:column;align-items:stretch}
.frm label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.frm label>select,.frm label>input{flex:1;min-width:0}
.psheet{display:none}
.psheet.open{display:block;position:fixed;inset:0;z-index:50;background:#fff;color:#000;overflow:auto;padding:14px}
.psheet button{background:#fff;color:#000;border:1px solid #000;border-radius:6px;padding:6px 12px}
.psheet button.pri{background:#000;color:#fff}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 auto 12px;max-width:277mm}
.pnote{font-size:12px;color:#333;flex:1;min-width:260px}
.sheet{width:277mm;margin:0 auto;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}
.ph{border-bottom:3px solid #000;padding-bottom:2mm;margin-bottom:3mm}
.pt{font-size:24pt;font-weight:900;letter-spacing:.5px;line-height:1.1}
.ps{font-size:9.5pt;margin-top:1mm}
.pg{display:grid;grid-template-columns:repeat(7,1fr);border-top:2px solid #000;border-left:2px solid #000}
.pdh{background:#000;color:#fff;text-align:center;font-weight:800;font-size:9pt;padding:1.2mm 0;border-right:1.5px solid #fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pc{border-right:2px solid #000;border-bottom:2px solid #000;min-height:var(--rh);padding:1mm 1.6mm;display:flex;flex-direction:column;gap:1mm;overflow:hidden}
.pc.pw{background:#e4e4e4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pc.pb{background:#fff}
.pd{font-size:9pt;font-weight:800;line-height:1}
.pr{display:flex;align-items:flex-start;gap:1.6mm;flex:1;min-width:0}
.pl{font-size:6.5pt;font-weight:800;border:1.5px solid #000;border-radius:1mm;padding:.2mm 1.2mm;flex:none;line-height:1.2;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pl.k24{background:#000;color:#fff}
.pr+.pr{border-top:1px dashed #000;padding-top:.8mm}
.pnb{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.pn{font-size:9pt;font-weight:900;white-space:nowrap;letter-spacing:.2px}
.pn.lg{font-size:7.5pt}
.pn.pe{font-weight:400;letter-spacing:1px}
.pf{font-size:6pt;white-space:nowrap}
.pfoot{margin-top:2mm;font-size:8pt;text-align:right}
.pfinal{border:2px solid #000;background:#fff;padding:6px 10px;font-weight:800;border-radius:6px;font-size:13px}
.pwm{display:none}
.dcard[hidden]{display:none!important}
.inanote{grid-column:1/-1;background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0}
.bulk{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.bulk summary{cursor:pointer;font-weight:600}
.bulk textarea{margin:6px 0}
@media screen{.sheet.wm{position:relative;overflow:hidden}.sheet.wm::after{content:"VERSION FINAL PARA FACTURACION";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg);font:900 44px Arial,Helvetica,sans-serif;white-space:nowrap;color:rgba(0,0,0,.13);pointer-events:none}}
@media screen{.psheet.open .sheet{margin-bottom:14px;border:1px solid #bbb;padding:6mm}}
.pbox{border:1px solid #000;border-radius:8px;padding:10px 12px;width:100%;display:flex;flex-direction:column;gap:8px;background:#f4f4f4}
.ptit{font-weight:800;font-size:15px}
.prow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.prow label{display:flex;flex-direction:column;font-size:12px;gap:2px;color:#000}
.prow label.chk2{flex-direction:row;align-items:center;gap:5px;align-self:center}
.prow select,.prow input[type=date]{background:#fff;color:#000;border:1px solid #000;border-radius:5px;padding:4px 6px;font-size:13px}
.pq{font-size:12px;align-self:center}
.psumwrap{margin-top:4mm}
.psumt{font-weight:800;font-size:10pt;margin-bottom:1mm}
.psum{border-collapse:collapse;font-size:9pt;min-width:50%}
.psum th,.psum td{border:1.5px solid #000;padding:.8mm 2.5mm;text-align:center}
.psum th{background:#000;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.psum .l{text-align:left}
.psum tr.tt td{font-weight:900;background:#e4e4e4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.plist{width:100%;border-collapse:collapse;font-size:9pt}
.plist th{background:#000;color:#fff;padding:1.2mm 2mm;border:1.5px solid #000;font-size:8.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.plist td{border:1.2px solid #000;padding:.7mm 2mm;height:5.6mm}
.plist td.fd{white-space:nowrap;width:26mm}
.plist tr.pw td{background:#e4e4e4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.plist thead{display:table-header-group}.plist tr{break-inside:avoid}
/* recordatorio flotante del mes */
.minictr{position:fixed;right:14px;bottom:14px;z-index:40}
.mini-box{width:236px;max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong,var(--line));border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:12px 14px;font-size:13px;line-height:1.35}
.mini-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--ink-2)}
.mini-x{min-height:26px!important;width:26px;padding:0!important;border-radius:8px!important;font-size:16px;line-height:1}
.mini-big{font-size:15px;margin:2px 0 8px}.mini-big b{font-size:22px;color:var(--accent-ink,var(--accent))}.mini-big.ok{color:var(--ok,#1a8f5a);font-weight:650}
.mini-bar{height:8px;border-radius:99px;background:var(--surface-3,var(--line));overflow:hidden}.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.mini-sub{color:var(--ink-2);font-size:12px;margin:6px 0}
.mini-t{margin:10px 0 3px;font-weight:650;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}.mini-t small{font-weight:400;text-transform:none;letter-spacing:0}
.mini-box ul{list-style:none;margin:0;padding:0}.mini-box li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.mini-box li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-pl{margin-top:6px!important;border-top:1px dashed var(--line);padding-top:4px!important}
.mini-pill{min-height:40px!important;padding:0 16px!important;border-radius:99px!important;background:var(--accent)!important;color:var(--on-accent,#fff)!important;border:none!important;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px}
.mini-pill.ok{background:var(--ok,#1a8f5a)!important}
@media (max-width:700px){.minictr{right:10px;bottom:10px}.mini-box{width:min(236px,calc(100vw - 20px))}}
@media print{
  .minictr{display:none!important}
  .sheet{break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .sheet{border:none!important;padding:0!important;margin:0!important}
  @page{size:A4 landscape;margin:9mm}
  :root{color-scheme:light!important}
  html,body{background:#fff!important;color:#000!important}
  .screen{display:none!important}
  .wrap{padding:0!important;max-width:none!important}
  .psheet{display:block!important;position:static!important;overflow:visible!important;padding:0!important;background:#fff!important}
  .ptools{display:none!important}
  .pwm{display:flex!important;position:fixed;left:0;top:0;width:100%;height:100%;align-items:center;justify-content:center;pointer-events:none;z-index:99}
  .pwm span{transform:rotate(-28deg);font:900 36pt Arial,Helvetica,sans-serif;white-space:nowrap;color:rgba(0,0,0,.14);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet.wm::after{display:none!important}
  .sheet{width:100%!important}
}
.layout.med{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1150px){.layout.med{grid-template-columns:1fr}}
.doclist{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px;margin-top:8px}
.doclist .doc{margin-top:0}
.restr{font-size:11px;color:var(--caution);margin-top:5px}
.allow{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.allow table{border-collapse:collapse;width:100%;margin-top:4px}
.allow th{font-size:10px;color:var(--mute);font-weight:600;text-align:center;padding:1px}
.allow th:first-child{text-align:left;width:34px}
.allow td{text-align:center}
.allow input{accent-color:var(--accent)}
.plantrow{display:flex;gap:10px;align-items:center;margin:5px 0;flex-wrap:wrap}
.plantrow input[type=text]{flex:1;min-width:120px}
.allowpl{display:flex;gap:12px;align-items:center;margin:6px 0;flex-wrap:wrap}
.pl2{margin-left:10px;font-size:13px}
.pl.kn{background:#555;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pc.pcx{background:repeating-linear-gradient(45deg,#fff,#fff 2mm,#d0d0d0 2mm,#d0d0d0 2.4mm);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.px{font-size:7pt;font-weight:800;text-align:center;margin:auto;line-height:1.2}
.nmin{border:1px solid var(--line);border-radius:6px;background:var(--cell);padding:4px 8px;font-weight:600;min-width:220px;margin-left:4px}
.lg1{color:var(--c)}
.dcard[hidden]{display:none!important}
/* ================= 1. TOKENS (oscuro por defecto) ================= */
:root{color-scheme:dark;
  --bg:#0f1419;--surface:#161c24;--surface-2:#1b222c;--surface-3:#232b37;
  --line:#2b3441;--line-strong:#3b4656;--field-line:#64728a;
  --ink:#e7ebf0;--ink-2:#a0aab8;
  --accent:#5e9bff;--on-accent:#0a1424;--accent-ink:#8cb8ff;--accent-soft:#223047;
  --ok:#4cc38a;--ok-soft:#18302a;--caution:#e6a84a;--caution-soft:#33281a;
  --danger:#ff7b86;--danger-soft:#3a1e25;--on-danger:#1a0a0d;
  --we:#1a2130;--hatch:#2b3441;--focus:#8cb8ff;
  --tint:24%;--stripe:78%;--stripe-to:#fff;
  --shadow-1:0 1px 0 rgba(0,0,0,.35);
  --shadow-2:0 12px 32px rgba(0,0,0,.55),0 0 0 1px var(--line-strong);
  --r-sm:6px;--r:8px;--r-lg:12px;--r-pill:999px;
  --ease:cubic-bezier(.2,.6,.2,1);
  /* alias de compatibilidad: los nombres viejos siguen funcionando */
  --card:var(--surface);--cell:var(--surface-2);--mute:var(--ink-2);
  --warn:var(--danger);--warnbg:var(--danger-soft);--optbg:var(--surface);
}
:root[data-theme=light]{color-scheme:light;
  --bg:#dfe4ec;--surface:#ffffff;--surface-2:#f3f5f9;--surface-3:#e1e6ee;
  --line:#bcc6d3;--line-strong:#8895a8;--field-line:#5f6f84;
  --ink:#101823;--ink-2:#46546a;--placeholder:#6a788c;
  --accent:#1650b8;--on-accent:#ffffff;--accent-ink:#1650b8;--accent-soft:#d6e4fa;
  --ok:#12764f;--ok-soft:#e7f5ee;--caution:#8f5b00;--caution-soft:#fff4e0;
  --danger:#c3283d;--danger-soft:#fdecee;--on-danger:#ffffff;
  --we:#e3e9f3;--hatch:#cdd5e0;--focus:#1650b8;
  --tint:20%;--stripe:84%;--stripe-to:#000;
  --shadow-1:0 1px 2px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.10);
  --shadow-2:0 12px 32px rgba(16,24,40,.16),0 0 0 1px var(--line);
}

/* ================= 2. BASE ================= */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif} /* igual que hoy: la impresión hereda de body */
.screen{line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 24px}
.month,.tile b,.tot td.n,.tot th.n,.dprog,.numin,.quota input,.dn,.md{font-variant-numeric:tabular-nums}
:where(.screen) :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
:where(.screen) button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;transition:background-color .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease)}
:where(.screen) button:hover{background:var(--surface-3)}
:where(.screen) button:active{transform:translateY(1px)}
:where(.screen) button:disabled{opacity:.45;cursor:not-allowed;transform:none;background:var(--surface)}
:where(.screen) button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
:where(.screen) button.pri:hover{background:color-mix(in srgb,var(--accent) 86%,var(--ink));filter:none}
:where(.screen) button.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
:where(.screen) button.ghost:hover{background:var(--surface-3);color:var(--ink)}
:where(.screen) button.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger);font-weight:600}
:where(.screen) button.danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
:where(.screen) button.danger-ghost{background:transparent;border-color:transparent;color:var(--danger)}
:where(.screen) button.danger-ghost:hover{background:var(--danger-soft)}
:where(.screen) button.icon{width:36px;padding:0}
:where(.screen) button svg,.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:where(.screen) :where(select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=password]){font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--field-line);border-radius:var(--r);min-height:36px;padding:0 10px}
:where(.screen) :where(select,input):hover{border-color:var(--ink-2)}
:where(.screen) :where(input)::placeholder{color:var(--placeholder,var(--ink-2));opacity:1}
:where(.screen) input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
:where(.screen) textarea{background:var(--surface-2);border:1px solid var(--field-line);border-radius:var(--r);color:var(--ink)}
.mini{min-height:32px!important;padding:0 10px!important;font-size:13px;border-radius:var(--r-sm)!important}
.mini.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.note{color:var(--ink-2);font-size:13px}
.ok{color:var(--ok);font-size:13px;font-weight:500}
.okc{color:var(--ok)}.badc{color:var(--danger)}
.sp{flex:1}
@media (prefers-reduced-motion:reduce){*:not(.msgbar){transition:none!important;animation:none!important}.msgbar{animation-duration:.01ms!important}}

/* ================= 3. CABECERA (app bar + pestañas) ================= */
.hdr,.appbar{display:flex;align-items:center;gap:16px;min-height:56px;border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:0 16px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-ic{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:16px;font-weight:650;margin:0;letter-spacing:0;line-height:1.2}
.brand-sub{display:block;font-size:12px;color:var(--ink-2);line-height:1.2}
.tabs{display:flex;gap:2px;align-self:stretch;margin:0;border:none;flex:1;min-width:0}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
@media (max-width:1180px){.hdr,.appbar{flex-wrap:wrap;gap:0 16px}.tabs{order:3;flex:1 1 100%}.tabs .tab{min-height:44px!important}}
/* en modo servidor hay una pestaña más (Administración) y el estado de guardado: las pestañas pasan a una segunda fila antes para que ninguna quede escondida */
@media (max-width:1560px){.hdr.srvh{flex-wrap:wrap;gap:0 16px}.hdr.srvh .tabs{order:3;flex:1 1 100%}.hdr.srvh .tabs .tab{min-height:44px!important}}
.tab{min-height:56px!important;padding:0 14px!important;border:none!important;border-radius:0!important;background:none!important;color:var(--ink-2)!important;font-weight:550;font-size:14px;position:relative;white-space:nowrap}
.tab:hover{color:var(--ink)!important}
.tab.on{color:var(--ink)!important;font-weight:650}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tab.tabred{color:var(--ink-2)!important}
.tab.tabred svg{color:var(--danger)}
.tab.tabred.on::after{background:var(--danger)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--danger);color:var(--on-danger);font-size:11px;font-weight:700;margin-left:2px;line-height:1}
.themebtn{width:40px!important;height:40px;min-height:40px!important;padding:0!important;border-radius:50%!important;flex:none;border-color:var(--line)!important}
.themebtn svg{width:20px;height:20px}
.help{position:relative;flex:none}
.help>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:var(--r);color:var(--ink-2);font-weight:500}
.help>summary::-webkit-details-marker{display:none}
.help>summary:hover{background:var(--surface-3);color:var(--ink)}
.help>div{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:min(440px,90vw);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:14px 16px;font-size:13.5px;line-height:1.55;color:var(--ink)}

/* ================= 4. BARRA DE MES / ACCIONES ================= */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mnav{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.mnav button{border:none!important;background:none;width:36px;padding:0!important;min-height:36px!important}
.month{font-size:16px;font-weight:650;min-width:150px;text-align:center}
.bar .subtabs{margin:0 0 0 8px}
.more{position:relative}
.more>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);font-weight:500}
.more>summary::-webkit-details-marker{display:none}
.more>summary:hover,.more[open]>summary{background:var(--surface-3)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:260px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:6px;display:flex;flex-direction:column}
.menu button{justify-content:flex-start!important;border:none!important;background:none;min-height:40px!important;width:100%;padding:0 12px!important;font-weight:450;border-radius:var(--r-sm)!important}
.menu button:hover{background:var(--surface-3)}
.menu button.danger-ghost{color:var(--danger)}
.menu .mh{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px 12px 4px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .renm{display:flex;flex-direction:column;gap:4px;padding:6px 12px 8px;margin:0;font-size:12px;color:var(--ink-2)}
.menu .renm input{width:100%;margin:0}

/* ================= 5. SUBPESTAÑAS DE PLANTA (control segmentado) ================= */
.subtabs{display:inline-flex;gap:2px;align-items:center;margin:0 0 10px;flex-wrap:wrap;background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.subtab{min-height:32px!important;border:none!important;background:transparent!important;color:var(--ink-2)!important;border-radius:6px!important;padding:0 14px!important;font-weight:550}
.subtab:hover{color:var(--ink)!important}
.subtab.on{background:var(--surface)!important;color:var(--ink)!important;font-weight:650;box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.subtab.add{color:var(--ink-2)!important;font-weight:500}
.subtab .badge{height:18px;min-width:18px;font-size:10.5px}

/* ================= 6. TARJETAS / AVISOS ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1)}
.card h3{margin:0 0 8px;font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .note{font-weight:400}
.msgbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:45;max-width:min(560px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--r);box-shadow:var(--shadow-2);padding:10px 14px;font-size:14px;margin:0;pointer-events:none;animation:toastout .3s ease 6s forwards}
@keyframes toastout{to{opacity:0;visibility:hidden;transform:translate(-50%,8px)}}
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-left:4px solid var(--accent);border-radius:var(--r);padding:8px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.qwarn{color:var(--caution);background:var(--caution-soft);border-radius:var(--r-sm);padding:6px 10px;font-size:13px;margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.neu{background:var(--surface-3);color:var(--ink-2)}

/* ================= 7. CALENDARIO ================= */
.calscroll{overflow-x:auto;padding:10px;--ch:130px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:0;grid-template-rows:auto;grid-auto-rows:minmax(var(--ch),auto)}
.dh{font-weight:650;color:var(--ink-2);text-align:center;padding:0 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.grid>.dh:nth-child(6),.grid>.dh:nth-child(7){color:var(--accent-ink)}
/* Alto parejo: cada día reserva el lugar de 3 turnos (24 h + D + N), aunque tenga menos */
.cell{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:6px;background:var(--surface-2);min-height:var(--ch);display:flex;flex-direction:column;gap:4px}
.cell.we{background:var(--we)}
.cell.blank{border:none;background:transparent}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.today .dn>span:first-child{background:var(--accent);color:var(--on-accent);border-radius:var(--r-pill);padding:0 7px}
.cell.off{background:var(--danger-soft);border-color:var(--danger);outline:none}
.cell.closed{background:repeating-linear-gradient(135deg,var(--surface-2) 0 7px,var(--hatch) 7px 8px);opacity:1}
.dn{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:13px;color:var(--ink);line-height:18px;min-height:18px}
.dn button{border:none;background:none;padding:0 4px;min-height:22px;font-weight:650;border-radius:var(--r-sm);color:var(--ink)}
.dn button.tg{border:1px dashed var(--accent)!important;padding:0 8px;min-height:24px;background:var(--surface)}
.na{font-size:11px;color:var(--ink-2);line-height:1.3}
.closedtag{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--danger);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:auto 0}
.closedtag .mini{text-transform:none;letter-spacing:0;font-weight:500;min-height:28px!important;background:var(--surface)}
/* turno */
.slot{position:relative;display:flex;align-items:center;gap:4px}
.slot.over{outline:2px dashed var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.slot.drag{opacity:.4}
.slot select{flex:1;min-width:0;height:28px;min-height:28px;border-radius:var(--r-sm);padding:0 7px;font-size:12.5px;font-weight:600;
  --cs:color-mix(in srgb,var(--c) var(--stripe),var(--stripe-to));
  background:color-mix(in srgb,var(--c) var(--tint),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-left:4px solid var(--cs);
  color:var(--ink);cursor:pointer;appearance:none;-webkit-appearance:none;text-overflow:ellipsis;white-space:nowrap}
.hlbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.hlbar label{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.hlbar label svg{width:16px;height:16px}
.hlbar select{height:32px;border-radius:var(--r-sm);padding:0 8px;font-size:13px}
.hlbar .hln{font-size:13px;color:var(--ink-2,var(--ink))}
.slot.dim{opacity:.12;transition:opacity .15s}
.slot.hl select{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 55%,transparent);font-weight:800}
.slot.dim:hover{opacity:.5}
@media print{.hlbar{display:none}.slot.dim{opacity:1}.slot.hl select{box-shadow:none}}
.slot select:hover{border-color:color-mix(in srgb,var(--c) 70%,var(--line));border-left-color:var(--cs)}
.slot .lk{flex:none;min-height:0!important;padding:0 2px!important;border:none!important;background:none!important}
.slot select option{background:var(--surface);color:var(--ink);font-weight:400}
.slot select.empty{background:var(--danger-soft);color:var(--danger);border:1px dashed var(--danger);border-left:4px solid var(--danger);font-weight:600}
.slot select.bad{border:2px solid var(--danger);border-left:4px solid var(--danger);outline:none}
.slot select.exc{border:2px solid var(--ok);border-left:4px solid var(--cs);outline:none}
.slot select.bad:focus-visible,.slot select.exc:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ================= 8. CONTROL ================= */
.issues{margin-top:12px}
.issues h3{margin-bottom:6px}
.issue{display:flex;gap:10px;align-items:flex-start;cursor:pointer;color:var(--ink);font-size:13.5px;padding:7px 8px;border-radius:var(--r-sm);border-bottom:1px solid var(--line)}
.issue:last-of-type{border-bottom:none}
.issue:hover{background:var(--surface-2)}
.issue input{margin-top:2px;accent-color:var(--ok);flex:none;width:18px;height:18px}
.issue span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:8px;vertical-align:1px}
.issue.done{color:var(--ink-2)}
.issue.done span::before{background:var(--ok)}
.ilist{max-height:240px;overflow:auto;margin-top:4px}

/* ================= 9. MÉDICOS ================= */
.medhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.medhead h3{margin:0}
.dfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.dfilters .seg button,.seg button{border-radius:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;flex-wrap:nowrap;max-width:100%;background:var(--surface)}
.seg button{border:none!important;border-right:1px solid var(--line-strong)!important;min-height:36px!important;padding:0 12px!important;white-space:nowrap;font-size:13.5px;background:none;border-radius:0!important}
.seg button:last-child{border-right:none!important}
.seg button.on,.dfilters .seg button.on{background:var(--accent-soft)!important;color:var(--accent-ink)!important;font-weight:650;box-shadow:inset 0 -2px 0 var(--accent)}
.dsearch{flex:1;min-width:180px;max-width:340px;min-height:36px}
/* Orden y filtros extra de la lista de médicos (solo pantalla, no tocan la impresión) */
@media screen{
  .dfxrow{margin-top:-4px}
  .dord{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .dord select{min-height:36px;font-size:13px;max-width:360px}
  .dfxsp{flex:1 1 0;min-width:0}
  .dfx{min-height:32px!important;padding:0 12px!important;border-radius:var(--r-pill)!important;font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .dfx.on{background:var(--accent-soft)!important;border-color:var(--accent)!important;color:var(--accent-ink)!important;font-weight:650}
  .dmetric{align-self:center;flex:none;font-size:12px;color:var(--ink-2);background:var(--surface-3);border-radius:var(--r-pill);padding:2px 9px;white-space:nowrap}
  @media (max-width:700px){.dord{flex:1 1 100%}.dord select{flex:1;max-width:none;min-width:0}.dfxsp{display:none}.dfx{flex:1 1 auto}}
}
.dlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dcard{--cs:color-mix(in srgb,var(--c) var(--stripe),var(--stripe-to));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 4px 0 0 var(--cs);overflow:hidden}
.dcard:hover{border-color:var(--line-strong)}
.dcard.open{border-color:var(--line-strong);box-shadow:inset 4px 0 0 var(--cs),var(--shadow-1)}
.dcard.inact{opacity:1}.dcard.inact .dnm{color:var(--ink-2);font-style:normal}
.dhead{display:flex;align-items:center;gap:8px 16px;padding:4px 14px 4px 16px;flex-wrap:wrap;min-height:56px}
.dtog{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:10px;border:none!important;background:none!important;padding:0!important;min-height:48px!important;text-align:left;justify-content:flex-start!important}
.dtog:hover .dnm{color:var(--accent-ink)}
.chev{display:inline-grid;place-items:center;width:16px;color:var(--ink-2);transition:transform .15s var(--ease);flex:none}
.dcard.open .chev{transform:rotate(90deg)}
/* ficha abierta = encabezado sólido con el color del médico (solo el encabezado: el cuerpo conserva sus colores) */
.dcard.open{--cd:color-mix(in srgb,var(--c) 68%,#000);border-color:var(--cd)}
.dcard.open .dhead{background:var(--cd);color:#fff}
.dcard.open .dhead .dnm,.dcard.open .dhead .dtog:hover .dnm{color:#fff}
.dcard.open .dhead .dsum,.dcard.open .dhead .dprog,.dcard.open .dhead .dprog b,.dcard.open .dhead .actsw,.dcard.open .dhead .chev{color:#fff}
.dcard.open .dhead .dsum,.dcard.open .dhead .dprog{opacity:.95}
.dcard.open .dhead .dot{background:#fff}
.dcard.open .dhead .inatag{background:rgba(255,255,255,.24);color:#fff}
.dcard.open .dhead .pbar{background:rgba(255,255,255,.3)}
.dcard.open .dhead .pbar i{background:#fff}
.dcard.open .dhead .pbar.over i{background:#ffc9cf}
.dcard.open .dhead .actsw input{background:rgba(255,255,255,.45)}
.dcard.open .dhead .actsw input:checked{background:#fff}
.dcard.open .dhead .actsw input:checked::before{background:var(--cd)}
.dcard.open .dbody{border-top:none}
.dcard.open .dhead .okc,.dcard.open .dhead .badc{color:#fff;font-weight:700}
.dcard.open .dhead .badc{background:#fff;color:#a3162b;border-radius:99px;padding:1px 8px}
.dcard.open .dhead :focus-visible{outline-color:#fff}
.dcard.open .dhead .actsw input{box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--cs,var(--c))}
.dnm{font-weight:650;font-size:15px;white-space:nowrap;flex:none}
.dsum{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.inatag{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-3);color:var(--ink-2);border-radius:var(--r-pill);padding:2px 8px;margin-left:6px}
/* interruptor Activo (mismo <input type=checkbox>, solo CSS) */
.actsw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-height:40px;padding:0 4px;cursor:pointer;white-space:nowrap;flex:none;border:none}
.actsw input{appearance:none;-webkit-appearance:none;width:36px!important;height:20px!important;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .15s var(--ease);margin:0}
.actsw input::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s var(--ease)}
.actsw input:checked{background:var(--ok)}
.actsw input:checked::before{transform:translateX(16px)}
.dprog{flex:0 0 220px;font-size:12.5px;color:var(--ink-2)}
.dprog b{color:var(--ink);font-weight:650}
.dprog.big{font-size:14px;margin-top:8px;flex:none}
.pbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.dprog.big .pbar{height:8px;border-radius:4px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:inherit}
.pbar.over i{background:var(--danger)}
.pbar.none i{background:var(--ink-2);opacity:.5}
.dbody{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--surface)}
.dtop{grid-column:1/-1;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.dfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;flex:1;min-width:0}
.dfields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:550;color:var(--ink-2);text-transform:none;letter-spacing:0}
.dfields input{min-height:40px!important;font-size:14px;min-width:0}
.dfields input.bad{border-color:var(--danger);background:var(--danger-soft)}
.sec{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;background:var(--surface-2);min-width:0}
.sec.wide{grid-column:1/-1}
.sec h4{margin:0 0 10px;font-size:14px;font-weight:650}
.plbox{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.sec h4+.plbox{border-top:none;padding-top:0}
.plname{font-weight:600;min-width:96px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);min-height:32px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:0 12px;min-height:34px;font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink-2)}
.tchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.tchip small{color:var(--accent-ink)}
.plbox.off .tchip{opacity:.45}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.lrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:10px 0 4px}.lrow label{display:flex;align-items:center;gap:8px;font-size:13.5px}
.numin{width:72px;min-height:36px!important;text-align:center;font-size:15px;padding:0 6px!important}
.numin.big{width:92px;min-height:44px!important;font-size:19px;font-weight:700}
.numin.set,.quota input.set{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.quota{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.quota label{display:flex;flex-direction:column;font-size:11.5px;font-weight:600;color:var(--ink-2);gap:4px;text-transform:none;letter-spacing:0}
.quota input{width:64px;min-height:36px!important;text-align:center;font-size:14px;padding:0 4px!important}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
.dchip{flex-direction:column;gap:0!important;min-height:44px!important;padding:2px 0!important;font-size:13px;font-weight:650;border-radius:var(--r)!important;line-height:1.15}
.dchip small{display:block;font-size:11px;font-weight:450;color:var(--ink-2)}
.dchip.on{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.dchip.off{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}.dchip.off small{color:var(--danger)}
.dchip.part{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:360px;margin-top:6px}
.mdh{font-size:11px;color:var(--ink-2);text-align:center;font-weight:650}
.md{min-height:36px!important;padding:0!important;font-size:13px;border-radius:var(--r-sm)!important;position:relative;line-height:1}
.md.we{background:var(--we)}
.md.x{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);font-weight:700;text-decoration:line-through}
.md.g::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.rule{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);margin-top:4px}
.addcard{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--surface-2)}
.addcard h4{margin:0 0 12px;font-size:15px;font-weight:650}
.addcard .row{align-items:center;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.toolsh{margin:24px 0 10px;font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.toolsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.toolsgrid>.card{margin:0!important}

/* ================= 10. TOTALES ================= */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--shadow-1)}
.tile b{display:block;font-size:24px;font-weight:700;color:var(--ink);margin:2px 0;letter-spacing:-.01em}
.tot table{width:100%;border-collapse:collapse}
.tot th{font-size:12px;color:var(--ink-2);text-align:left;font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.tot td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tot tr:hover td{background:var(--surface-2)}
.tot th.n,.tot td.n{text-align:right}
.tot .dot{display:inline-block;vertical-align:middle}
.tot .tbar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) var(--stripe),var(--stripe-to));margin-top:6px;margin-left:auto}
.tot tr.sum td{border-top:2px solid var(--line-strong);border-bottom:none;background:var(--surface-2);font-weight:700}
.tot .fch{font-size:12.5px;color:var(--ink-2);min-width:230px}
.tot .fch b{color:var(--ink);font-weight:600}
.pn2{display:inline-block;background:var(--surface-3);border-radius:var(--r-pill);padding:0 8px;font-size:11.5px;color:var(--ink-2);margin-right:4px}

/* ================= 11. ANULAR DÍAS ================= */
.annul{border-top:3px solid var(--danger);margin-bottom:12px}
.bigred{background:var(--danger)!important;border:1px solid var(--danger)!important;color:var(--on-danger)!important;font-weight:650;font-size:14px;letter-spacing:0;min-height:40px!important;padding:0 18px!important;border-radius:var(--r)!important}
.bigred:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))!important}
.row2{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.row2 label{display:flex;flex-direction:column;font-size:12px;font-weight:550;color:var(--ink-2);gap:4px}
.dows{display:flex;gap:6px;flex-wrap:wrap}
.dows label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:0 12px;min-height:36px;cursor:pointer;color:var(--ink);font-size:13px}
.dows label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}

.dna{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}

<body>
<div class="wrap" id="app"></div>
<script>
//<core>
const TYPES={
  h24:{label:'24 h',short:'24h',hours:24,span:'08–08',desc:'08:00 a 08:00 del día siguiente',start:8},
  h12:{label:'12 h día',short:'12 día',hours:12,span:'08–20',desc:'08:00 a 20:00',start:8},
  n12:{label:'12 h noche',short:'12 noche',hours:12,span:'20–08',desc:'20:00 a 08:00 del día siguiente',start:20},
  // Mitades de una guardia de 24 h dividida (un día puntual). Son sids propios: «<planta>.h24d» y «<planta>.h24n».
  h24d:{label:'24 h · día',short:'24 día',hours:12,span:'08–20',desc:'Mitad de día de una guardia de 24 h (08:00 a 20:00)',start:8,half:true},
  h24n:{label:'24 h · noche',short:'24 noche',hours:12,span:'20–08',desc:'Mitad de noche de una guardia de 24 h (20:00 a 08:00 del día siguiente)',start:20,half:true}};
const TYPE_ORDER=['h24','h12','n12'];
const ALL7=[1,1,1,1,1,1,1];
const DOWN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MAX_PLANTS=Infinity;   // sin tope de plantas
const APP_VERSION='1.2.1';   // subirla en cada entrega (junto con empaquetado/VERSION); se muestra en Administración
const DEFAULT_DOCTORS=['Ana Pérez','Luis Gómez','Marta Ruiz','Pablo Díaz','Lucía Torres','Diego Romero','Sofía Herrera','Martín Acosta','Valeria Molina','Tomás Silva'];   // nombres de ejemplo (ficticios)
function pad(n){return String(n).padStart(2,'0')}
function dkey(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function daysIn(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function dayNum(key){const p=key.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000)}
function keyFromDayNum(n){const d=new Date(n*86400000);return dkey(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
function dow(key){const p=key.split('-').map(Number);return (new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()+6)%7} // 0=lunes
// Un «turno» se identifica con sid = "<planta>.<tipo>", por ejemplo "1.h24" o "2.h24"
function stype(sid){return sid.split('.')[1]}
function spid(sid){return +sid.split('.')[0]}
function slotsOf(st,pid){
  const out=[];
  st.plants.forEach(p=>{if(pid!=null&&p.id!==pid)return;TYPE_ORDER.forEach(t=>{if(p.types.includes(t))out.push(p.id+'.'+t)})});
  return out;
}
// ---- Guardia dividida: un 24 h de un día puntual pasa a dos mitades (día 08–20 y noche 20–08) con médicos distintos.
// st.splits['YYYY-MM-DD|<planta>.h24']=true marca el día dividido. En ese día el 24 h NUNCA tiene médico: lo tienen las mitades.
function isHalf(sid){const t=stype(sid);return t==='h24d'||t==='h24n'}
function halfSids(st){const out=[];st.plants.forEach(p=>{if(p.types.includes('h24')){out.push(p.id+'.h24d');out.push(p.id+'.h24n')}});return out}
function allSids(st){return slotsOf(st).concat(halfSids(st))}
function isSplit(st,k,sid24){return !!(st.splits&&st.splits[k+'|'+sid24])}
function halfParent(sid){return spid(sid)+'.h24'}
// Turnos de un día (de una planta o de todas) con cada 24 h dividido reemplazado por sus dos mitades
function daySids(st,k,pid){const out=[];slotsOf(st,pid).forEach(sid=>{if(stype(sid)==='h24'&&isSplit(st,k,sid)){out.push(spid(sid)+'.h24d',spid(sid)+'.h24n')}else out.push(sid)});return out}
function plantName(st,pid){const p=st.plants.find(x=>x.id===pid);return p?p.name:'Planta '+pid}
function slotLabel(st,sid){return plantName(st,spid(sid))+' · '+TYPES[stype(sid)].label}
function shiftTimes(key,sid){const T=TYPES[stype(sid)],s=dayNum(key)*24+T.start;return [s,s+T.hours]}
function defaultPlants(){return [{id:1,name:'Planta 1',types:['h24','h12']},{id:2,name:'Planta 2',types:['h24']}]}
function freshState(){
  return {v:2,year:2026,month:11,rest24:24,rest12:12,seed:1,splits:{},
    nextId:DEFAULT_DOCTORS.length+1,nextPid:3,
    plants:defaultPlants(),
    doctors:DEFAULT_DOCTORS.map((n,i)=>({id:i+1,name:n})),
    assign:{},locks:{},unavail:{},rules:[],quotas:{},ignored:{},allow:{},closed:{}};
}
// Calendario en cero: sin médicos ni guardias (las plantas quedan con su configuración inicial)
function blankState(){const b=freshState();b.doctors=[];b.nextId=1;return b}
// Convierte datos de la versión de una sola planta y completa campos que falten
function migrate(o){
  if(!o.plants){
    o.plants=defaultPlants();o.nextPid=3;
    const A={};Object.keys(o.assign||{}).forEach(k=>{A[k]={};Object.keys(o.assign[k]).forEach(t=>{A[k]['1.'+t]=o.assign[k][t]})});o.assign=A;
    const L={};Object.keys(o.locks||{}).forEach(x=>{const p=x.split('|');L[p[0]+'|1.'+p[1]]=true});o.locks=L;
    (o.rules||[]).forEach(r=>{if(!r.sid){r.sid='1.'+r.type;delete r.type}});
    Object.keys(o.quotas||{}).forEach(ym=>Object.keys(o.quotas[ym]).forEach(id=>{
      const q=o.quotas[ym][id],n={};
      if(q.c24!=null)n['1.h24']=q.c24;if(q.c12!=null)n['1.h12']=q.c12;if(q.wk!=null)n.wk=q.wk;
      o.quotas[ym][id]=n;
    }));
    o.ignored={};o.v=2;
  }
  const f=freshState();Object.keys(f).forEach(k=>{if(o[k]==null)o[k]=f[k]});
  if(!o.nextPid)o.nextPid=Math.max(0,...o.plants.map(p=>p.id))+1;
  return o;
}
function slotDoc(st,key,sid){return (st.assign[key]&&st.assign[key][sid])||null}
function setSlot(st,key,sid,id){
  if(id&&stype(sid)==='h24'&&isSplit(st,key,sid))return;   // un día dividido: el 24 h entero no puede tener médico
  if(!st.assign[key])st.assign[key]={};
  if(id)st.assign[key][sid]=id;else delete st.assign[key][sid];
}
// Divide el 24 h de ese día. keep='d'|'n': qué mitad se queda con el médico actual (la otra queda libre para elegir).
function splitSlot(st,k,sid,keep){
  if(stype(sid)!=='h24'||isSplit(st,k,sid)||isClosed(st,sid,k)||!slotsOf(st).includes(sid))return false;
  const doc=slotDoc(st,k,sid),P=spid(sid),hd=P+'.h24d',hn=P+'.h24n';
  setSlot(st,k,sid,null);delete st.locks[k+'|'+sid];
  st.splits=st.splits||{};st.splits[k+'|'+sid]=true;
  if(doc)setSlot(st,k,keep==='n'?hn:hd,doc);
  st.locks[k+'|'+hd]=true;st.locks[k+'|'+hn]=true;
  return true;
}
// Junta las mitades en un 24 h. keep='d'|'n': la mitad cuyo médico se queda con las 24 h (si esa está vacía, queda el de la otra).
function joinSlot(st,k,sid,keep){
  if(!isSplit(st,k,sid))return false;
  const P=spid(sid),hd=P+'.h24d',hn=P+'.h24n',first=keep==='n'?hn:hd,other=keep==='n'?hd:hn;
  const doc=slotDoc(st,k,first)||slotDoc(st,k,other);
  delete st.splits[k+'|'+sid];
  setSlot(st,k,hd,null);setSlot(st,k,hn,null);delete st.locks[k+'|'+hd];delete st.locks[k+'|'+hn];
  if(doc){setSlot(st,k,sid,doc);st.locks[k+'|'+sid]=true}
  return true;
}
// Normaliza: el mismo médico en las dos mitades vuelve a ser un 24 h; marcas huérfanas o inconsistentes se descartan.
function fixSplits(st){
  if(!st.splits)return;
  const real=slotsOf(st);
  Object.keys(st.splits).forEach(key=>{
    const i=key.indexOf('|'),k=key.slice(0,i),sid=key.slice(i+1),P=spid(sid),hd=P+'.h24d',hn=P+'.h24n';
    const wipe=()=>{delete st.splits[key];if(st.assign[k]){delete st.assign[k][hd];delete st.assign[k][hn]}delete st.locks[k+'|'+hd];delete st.locks[k+'|'+hn]};
    if(!real.includes(sid)){wipe();return}
    if(st.assign[k]&&st.assign[k][sid]){wipe();return}   // dato inconsistente: gana el 24 h entero
    const a=slotDoc(st,k,hd),b=slotDoc(st,k,hn);
    if(a&&a===b)joinSlot(st,k,sid,'d');
  });
  // mitades asignadas sin la marca de «día dividido» (p. ej. de un JSON dañado): se les repone la marca para que
  // se vean en el calendario y en el reporte; lo hecho nunca se pierde ni cuenta horas escondido
  Object.keys(st.assign||{}).forEach(k=>{
    const a=st.assign[k];if(!a)return;
    ['h24d','h24n'].forEach(h=>Object.keys(a).forEach(sid=>{
      if(!sid.endsWith('.'+h)||!a[sid])return;
      const P=spid(sid),parent=P+'.h24',key=k+'|'+parent;
      if(st.splits[key])return;
      if(real.includes(parent)&&!a[parent])st.splits[key]=true;
      else delete a[sid];   // planta sin turno de 24 h, o día con el 24 h entero ya asignado: la mitad no puede existir
    }));
  });
}
function isClosed(st,sid,k){const c=st.closed&&st.closed[spid(sid)];return !!(c&&c[k])}
function openCount(st,sid){let n=0;monthKeys(st).forEach(k=>{if(!isClosed(st,sid,k))n++});return n}
// Anula (close=true) o reabre (close=false) días de una planta o de todas. Al anular se vacían esos días.
function annulDays(st,f,close){
  if(!f.from||!f.to)return {n:0,err:'Completá las fechas.'};
  let n1=dayNum(f.from),n2=dayNum(f.to);if(n2<n1){const x=n1;n1=n2;n2=x}
  if(n2-n1>740)return {n:0,err:'El rango es demasiado largo (máximo dos años).'};
  if(!f.dows.some(Boolean))return {n:0,err:'Elegí al menos un día de la semana.'};
  const pids=f.plant==='all'?st.plants.map(p=>p.id):[f.plant];
  st.closed=st.closed||{};let n=0;
  for(let x=n1;x<=n2;x++){
    const k=keyFromDayNum(x);if(!f.dows[dow(k)])continue;
    pids.forEach(pid=>{
      const c=st.closed[pid]=st.closed[pid]||{};
      if(close){if(!c[k]){c[k]=true;n++}if(st.splits)delete st.splits[k+'|'+pid+'.h24'];allSids(st).filter(s2=>spid(s2)===pid).forEach(sid=>{setSlot(st,k,sid,null);delete st.locks[k+'|'+sid]})}
      else if(c[k]){delete c[k];n++}
    });
  }
  Object.keys(st.closed).forEach(pid=>{if(!Object.keys(st.closed[pid]).length)delete st.closed[pid]});
  return {n,err:null};
}
function isUnavail(st,id,key){return !!(st.unavail[id]&&st.unavail[id][key])}
function restNeed(st,sid){return stype(sid)==='h24'?st.rest24:st.rest12}
// Si el médico, puesto en (key,sid), pisa o no respeta el descanso respecto de sus otras guardias
// (de cualquier planta). Turnos pegados de la MISMA planta (ej.: 12 h día + 12 h noche) se toman como una sola
// guardia seguida, que no puede pasar de 24 h. Devuelve null o {kind:'overlap'|'rest'|'chain', sid, key}.
function conflictInfo(st,id,key,sid){
  const base=dayNum(key),all=allSids(st),g=[];
  for(let off=-3;off<=3;off++){
    const k2=keyFromDayNum(base+off),a=st.assign[k2];if(!a)continue;
    for(const s2 of all){

function quotaInfo(st){

// Función de costo: menor = reparto más parejo y más cerca de los objetivos
function objFrom(X,S,empties){

  X.sids.forEach(sid=>{c+=3*vr(d=>X.Q[d.id][sid]==null&&X.can[d.id][sid],s=>s.n[sid]||0)});
  docs.forEach(d=>{const q=X.Q[d.id],s=S[d.id];
    X.sids.forEach(sid=>{if(q[sid]!=null){const x=(s.n[sid]||0)-q[sid];c+=800*x*x}});

function generate(st){

// Problemas de un turno: [{id,pid,text}]. El id es estable para poder marcar excepciones.
function slotProblems(st,k,sid){

  const day=k.slice(8)+'/'+k.slice(5,7)+' · '+slotLabel(st,sid);

  if(d&&d.active===false&&k>=todayKey().slice(0,8)+'01')out.push({id:k+'|'+sid+'|ina|'+id,pid,text:day+': '+nm+' está inactivo'});
  if(isUnavail(st,id,k))out.push({id:k+'|'+sid+'|nd|'+id,pid,text:day+': '+nm+' figura no disponible'});
  if(!isAllowed(st,id,k,sid))out.push({id:k+'|'+sid+'|na|'+id,pid,text:day+': '+nm+' no tiene habilitado este turno'});
  const ci=conflictInfo(st,id,k,sid);

    const d2=ci.key.slice(8)+'/'+ci.key.slice(5,7);
    out.push({id:k+'|'+sid+'|desc|'+id,pid,text:day+': '+nm+(ci.kind==='overlap'
      ?' ya está de guardia en '+slotLabel(st,ci.sid)+' ('+d2+')'
      :ci.kind==='chain'?' haría más de 24 h seguidas junto con su guardia en '+slotLabel(st,ci.sid)+' ('+d2+')'
      :' sin el descanso mínimo respecto de su guardia en '+slotLabel(st,ci.sid)+' ('+d2+')')});
  }

}
function findIssues(st){
  const out=[];

// Quita excepciones de avisos del mes mostrado que ya no existen (así no reaparecen "ya aceptados" por error)

  st.ignored=st.ignored||{};const ym=ymKey(st);const ids=new Set(findIssues(st).map(x=>x.id));

// Deja el mes sin nadie (todas las plantas, o solo una si se pasa pid) y vuelve a poner solo las reglas semanales.
// También saca fijados, días divididos y excepciones aceptadas. Devuelve cuántos turnos quedaron puestos por reglas.
function clearMonth(st,pid,keepLocks){
  const keys=monthKeys(st),ym=ymKey(st),scope=sid=>pid==null||spid(sid)===pid;
  const wide=[];allSids(st).forEach(sid=>{if(!scope(sid))return;wide.push(sid);if(stype(sid)==='h24')wide.push(spid(sid)+'.h24d',spid(sid)+'.h24n')});
  keys.forEach(k=>{
    const a=st.assign[k];
    const fijo=sid=>!!keepLocks&&!!st.locks[k+'|'+sid];   // con «conservar fijados», un turno con candado no se toca
    if(a){wide.forEach(sid=>{if(!fijo(sid))delete a[sid]});if(!Object.keys(a).length)delete st.assign[k]}
    wide.forEach(sid=>{if(!fijo(sid))delete st.locks[k+'|'+sid]});

      if(!(sk.startsWith(k+'|')&&scope(sk.split('|')[1])))return;

// Intercambia dos turnos (arrastrar y soltar). Ambos quedan fijados.

// Fija o suelta todos los turnos de una planta en el mes mostrado
function lockPlant(st,pid,lock){

// Cambio por bloque. f={act:'assign'|'replace'|'unavail'|'clear',a,b,plant:'all'|pid,type:'both'|'h24'|'h12',from,to,dows:[7]}
function batchApply(st,f){

  let n1=dayNum(f.from),n2=dayNum(f.to);if(n2<n1){const x=n1;n1=n2;n2=x}
  if(n2-n1>370)return 'El rango es demasiado largo (máximo un año).';
  if(!f.dows.some(Boolean))return 'Elegí al menos un día de la semana.';
  const A=f.a===''?null:f.a,B=f.b===''?null:f.b;
  if(f.act!=='clear'&&A==null)return 'Elegí un médico.';

    if(f.act==='unavail'){(st.unavail[A]=st.unavail[A]||{})[k]=true;n++;continue}

    }
  }

}

// Todas las PCs aplican los mismos parches en el mismo orden (el que fija el buzón) y terminan con el mismo calendario.
// Si dos tocaron lo mismo, queda lo del último que llegó, salvo que lo suyo sea automático y lo otro manual: lo manual gana.

function miniData(stats,keys){
  let total=0,vacios=0;const porPlanta=[];
  S.plants.forEach(pl=>{let t=0,v=0;
    keys.forEach(k=>daySids(S,k,pl.id).forEach(sid=>{if(isClosed(S,sid,k))return;t++;if(!slotDoc(S,k,sid))v++}));
    total+=t;vacios+=v;porPlanta.push({name:pl.name,total:t,vacios:v})});
  const docs=activeDocs(S).filter(d=>slotsOf(S).some(sid=>canDo(S,d.id,sid))).map(d=>({d,g:(stats[d.id]?stats[d.id].hours:0)/24}));
  const mas=docs.filter(x=>x.g>0).sort((a,b)=>b.g-a.g||dispName(a.d).localeCompare(dispName(b.d))).slice(0,3);
  const menos=docs.slice().sort((a,b)=>a.g-b.g||dispName(a.d).localeCompare(dispName(b.d))).slice(0,3);
  return {total,vacios,porPlanta,mas,menos,cubiertos:total-vacios};
}

function pfDefaults(){const k=monthKeys(S);return {plant:'all',types:'both',from:k[0],to:k[k.length-1],layout:'cal',summary:true,final:false}}
// Facturación: una mitad de una guardia de 24 h dividida es una guardia de 12 h (se paga como 12 h).
// «Solo 24 h» = guardias de 24 h COMPLETAS; «Solo 12 h» = 12 h día/noche + mitades de 24 h divididas;
// «Todos» = todo. Así «solo 24 h» + «solo 12 h» siempre suman exactamente lo mismo que «Todos».
function pfSids(pl){return slotsOf(S,pl.id).filter(sid=>pf.types!=='h24'||stype(sid)==='h24')}
// ¿qué se muestra del turno sid ese día según el filtro? (lista de sids; las mitades salen como h24d/h24n)
function pfEntries(sid,k){
  if(stype(sid)!=='h24')return [sid];
  const sp=isSplit(S,k,sid),pid=spid(sid);
  if(pf.types==='h24')return sp?[]:[sid];
  if(sp)return [pid+'.h24d',pid+'.h24n'];
  return pf.types==='h12'?[]:[sid];
}
function pfHasHalvesIn(pl,a,b){return Object.keys(S.splits||{}).some(sk=>{const i=sk.indexOf('|');return sk.slice(i+1)===pl.id+'.h24'&&dayNum(sk.slice(0,i))>=a&&dayNum(sk.slice(0,i))<=b})}
function pfHasHalves(pl){let a=dayNum(pf.from),b=dayNum(pf.to);if(b<a){const x=a;a=b;b=x}return pfHasHalvesIn(pl,a,b)}
// Aclaración de las mitades según el filtro (solo si hay alguna en el período)
function pfHalfNote(){
  if(!S.plants.some(pfHasHalves))return '';
  if(pf.types==='h24')return '<b>DIVIDIDA</b>: guardia de 24 h repartida en dos mitades de 12 h; figura en «Solo 12 h» y en «Todos»';
  return '<b>24 día / 24 noche</b>: mitades de una guardia de 24 h dividida (08 a 20 / 20 a 08); cada una cuenta como 12 h';
}
// Aviso al emitir la VERSIÓN FINAL PARA FACTURACIÓN: qué falta en el período y que el PDF no se actualiza solo
function pfFinalWarning(){
  let n1=dayNum(pf.from),n2=dayNum(pf.to);if(n2<n1){const x=n1;n1=n2;n2=x}
  let vacios=0;
  S.plants.filter(x=>pf.plant==='all'||x.id===pf.plant).forEach(pl=>{
    pfSids(pl).forEach(sid=>{for(let x=n1;x<=n2;x++){const k=keyFromDayNum(x);if(isClosed(S,sid,k))continue;
      pfEntries(sid,k).forEach(e=>{if(!slotDoc(S,k,e))vacios++})}})});
  const ctl=findIssues(S).filter(i=>!S.ignored[i.id]).length;
  const f=k=>k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(0,4);
  return 'Vas a emitir la versión final para facturación.\n\nPeríodo: '+f(keyFromDayNum(n1))+' al '+f(keyFromDayNum(n2))+'\n\n'
    +(vacios?'Hay '+vacios+' turno'+(vacios===1?'':'s')+' sin médico (van a salir en blanco en el PDF).\n':'Todos los turnos tienen médico.\n')
    +(ctl?'En «Control» hay '+ctl+' aviso'+(ctl===1?'':'s')+' sin revisar.\n':'')
    +'\nEste PDF es el que se usa para facturar. Si después cambiás algo en el calendario, hay que emitir uno nuevo.\n\n¿Querés emitirlo?';
}
function pfTitleBits(){
  const t=pf.types==='h24'?'SOLO GUARDIAS DE 24 H COMPLETAS':pf.types==='h12'?'SOLO GUARDIAS DE 12 H (INCLUYE MITADES DE 24 H DIVIDIDAS)':'';
  const f=x=>x.slice(8)+'/'+x.slice(5,7)+'/'+x.slice(0,4);
  return {t,range:f(pf.from)+' AL '+f(pf.to)};
}
function pfFileName(){
  const lo=pf.from<=pf.to?pf.from:pf.to,hi=pf.from<=pf.to?pf.to:pf.from;
  const f=lo.replace(/-/g,''),t=hi.replace(/-/g,'');
  const pl=pf.plant==='all'?'global':plantName(S,pf.plant).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const ty=pf.types==='both'?'24h-y-12h':pf.types==='h24'?'solo-24h':'solo-12h';
  return 'guardias_'+pl+'_'+ty+'_'+f+'-'+t;
}
// Resumen para facturación: cantidades por médico dentro del período y los turnos elegidos
function pfSummaryHtml(sids,n1,n2){
  // Todo sale de lo ASIGNADO (lo hecho). Una mitad de 24 h dividida vale 12 h. No se descarta nada en silencio:
  // los médicos borrados que aún figuren en el calendario aparecen como filas propias.
  const docs=S.doctors.slice(),known=new Set(S.doctors.map(d=>d.id)),ghost=new Set();
  const plantsIn=new Set(sids.map(spid));
  for(let x=n1;x<=n2;x++){const a=S.assign[keyFromDayNum(x)];if(!a)continue;
    Object.keys(a).forEach(sid=>{const id=a[sid];if(id!=null&&!known.has(id)&&plantsIn.has(spid(sid)))ghost.add(id)})}
  ghost.forEach(id=>docs.push({id,name:'(médico borrado, id '+id+')'}));
  let skipHalf=0;
  if(pf.types==='h24'){for(let x=n1;x<=n2;x++){const k=keyFromDayNum(x);sids.forEach(sid=>{
    if(stype(sid)==='h24'&&!isClosed(S,sid,k)&&isSplit(S,k,sid)){const P=spid(sid);if(slotDoc(S,k,P+'.h24d')!=null)skipHalf++;if(slotDoc(S,k,P+'.h24n')!=null)skipHalf++}})}}
  const rows=[],T={c24:0,cd:0,cn:0,hd:0,hn:0,h:0};
  docs.forEach(d=>{
    const c={c24:0,cd:0,cn:0,hd:0,hn:0};
    for(let x=n1;x<=n2;x++){const k=keyFromDayNum(x);sids.forEach(sid=>{
      if(isClosed(S,sid,k))return;                       // igual que las celdas: planta cerrada ese día
      const t=stype(sid),P=spid(sid);
      if(t==='h24'){
        if(isSplit(S,k,sid)){
          if(pf.types==='h24')return;                    // las mitades van en «Solo 12 h» y «Todos»
          if(slotDoc(S,k,P+'.h24d')===d.id)c.hd++;
          if(slotDoc(S,k,P+'.h24n')===d.id)c.hn++;
          return}
        if(pf.types==='h12')return;
        if(slotDoc(S,k,sid)===d.id)c.c24++;
        return}
      if(slotDoc(S,k,sid)===d.id){if(t==='n12')c.cn++;else c.cd++}
    })}
    const n12=c.cd+c.cn+c.hd+c.hn;
    if(!c.c24&&!n12)return;
    const hh=c.c24*24+n12*12;
    T.c24+=c.c24;T.cd+=c.cd;T.cn+=c.cn;T.hd+=c.hd;T.hn+=c.hn;T.h+=hh;rows.push([d.name,c,hh]);
  });
  const warn=skipHalf?'<div class="pfoot" style="text-align:left"><b>ATENCIÓN:</b> hay '+skipHalf+' mitad'+(skipHalf===1?'':'es')+' de guardias de 24 h divididas que NO están en este resumen (se facturan como guardias de 12 h). Están en el reporte «Solo 12 h» y en «Todos».</div>':'';
  if(!rows.length)return warn;
  const cols=[];   // [clave, título]
  if(sids.some(x=>stype(x)==='h24')&&pf.types!=='h12')cols.push(['c24','Guardias 24 h']);
  if(sids.some(x=>stype(x)==='h12'))cols.push(['cd','12 h día']);
  if(sids.some(x=>stype(x)==='n12'))cols.push(['cn','12 h noche']);
  if(T.hd>0||T.hn>0){cols.push(['hd','Mitad día (24 h dividida)']);cols.push(['hn','Mitad noche (24 h dividida)'])}
  let t='<table class="psum"><tr><th class="l">Médico</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Horas</th><th>Guardias equiv. (24 h)</th></tr>';
  rows.forEach(r=>{t+='<tr><td class="l">'+esc(r[0])+'</td>'+cols.map(c=>'<td>'+r[1][c[0]]+'</td>').join('')+'<td>'+r[2]+'</td><td>'+eqg(r[2])+'</td></tr>'});
  t+='<tr class="tt"><td class="l">TOTAL</td>'+cols.map(c=>'<td>'+T[c[0]]+'</td>').join('')+'<td>'+T.h+'</td><td>'+eqg(T.h)+'</td></tr></table>';
  if(T.hd>0||T.hn>0)t+='<div class="pfoot" style="text-align:left">«Mitad» = mitad de una guardia de 24 h dividida entre dos médicos (08 a 20 y 20 a 08). Cada mitad cuenta como 12 h.</div>';
  return t+warn;
}

const WKLBL={no:'no hace',ambos:'sí (12 h y 24 h)','12':'solo 12 h','24':'solo 24 h',mixto:'a medida'};
function docSummary(d,stats){
  const q=getQ(S,d.id)||{},bits=[];
  const allS=slotsOf(S),okS=allS.filter(sid=>canDo(S,d.id,sid));
  if(!okS.length)bits.push('<span class="badc">no hace guardias</span>');
  else if(okS.length===allS.length&&S.plants.length>1)bits.push('todas las plantas');
  else S.plants.forEach(p=>{const ss=slotsOf(S,p.id).filter(s=>okS.includes(s));if(ss.length)bits.push(esc(pshort(p.id))+': '+ss.map(s=>TYPES[stype(s)].short).join(' + '))});
  const types=relTypes(S,d.id),wm=weekendMode(S,d.id);
  const both=types.includes('h24')&&types.some(t=>t!=='h24');const wkTxt=both?WKLBL[wm]:(wm==='no'?'no hace':wm==='mixto'?'a medida':'sí');
  const qS=slotsOf(S).filter(s=>q[s]!=null);if(qS.length)bits.push('objetivo: '+qS.map(s=>esc(pshort(spid(s)))+' '+TYPES[stype(s)].short+' '+q[s]).join(', '));
  bits.push('FdS: '+wkTxt+(q.wk!=null?' (máx. '+q.wk+')':''));
  const offD=[0,1,2,3,4].filter(i=>dayMode(S,d.id,i)==='off');
  if(offD.length)bits.push('no está: '+offD.map(i=>DIAS[i]).join(', '));
  const nX=monthKeys(S).filter(k=>isUnavail(S,d.id,k)).length;
  if(nX)bits.push(nX+' fecha'+(nX===1?'':'s')+' sin estar');
  const nR=(S.rules||[]).filter(r=>r.doc===d.id).length;
  if(nR)bits.push(nR+' fijo'+(nR===1?'':'s')+' semanal'+(nR===1?'':'es'));
  return bits.join(' · ');
}

// ================= MODO SERVIDOR =================
// Si la página se abre desde el servidor (http://localhost:8080) los datos viven en la base del servidor:
// login, guardado con versiones y aviso cuando otra persona guardó. Si se abre con doble clic (file://), todo sigue como antes (localStorage).
const SRV={upd:null,updMsg:'',on:false,user:null,role:null,version:0,lastSent:'',timer:null,saving:false,dirty:false,status:'saved',conflict:null,pollT:null,retryT:null,adm:null,admLoading:false,draft:{u:'',p:'',r:'editor'},pw:{o:'',n:''}};
// Grupo: sincronización con otras PCs a través del buzón cifrado (ver syncRound en el núcleo). cl = {g,token,k,epoch,base,seen,adopt,nom,role}
const GRP={on:false,cl:null,st:'idle',busy:false,t:null,needRender:false,metaDirty:false,metaVer:0,fails:0,draft:'',invite:'',info:'',hooks:null,members:null,membersLoading:false,pending:null,last:0,autoNext:false};
async function api(method,path,body){
  const o={method,headers:{'X-Requested-With':'guardias'},credentials:'same-origin'};
  if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch('/api/'+path,o);let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok,data:j};
}
// Lo que se sincroniza NO incluye el mes que cada uno está mirando (eso es de cada persona)
function srvPayload(){const o=JSON.parse(JSON.stringify(S));delete o.month;delete o.year;return JSON.stringify(o)}
function srvView(){try{sessionStorage.setItem('guardias_view',JSON.stringify({y:S.year,m:S.month}))}catch(e){}}
function srvApplyView(){
  let v=null;try{v=JSON.parse(sessionStorage.getItem('guardias_view')||'null')}catch(e){}
  const d=new Date();
  S.year=(v&&Number.isInteger(v.y))?v.y:d.getFullYear();
  S.month=(v&&Number.isInteger(v.m)&&v.m>=0&&v.m<=11)?v.m:d.getMonth();
}
const STAT={saved:['Guardado','ok'],pending:['Guardando…','pend'],offline:['Sin conexión, reintentando…','bad'],conflict:['Otra persona guardó','bad'],login:['Volvé a ingresar','bad']};
function srvStatusHtml(){const s=STAT[SRV.status]||STAT.saved;return '<span id="srvstat" class="srvstat s-'+s[1]+'" role="status">'+s[0]+'</span>'}
function srvSetStatus(st){SRV.status=st;const el=document.getElementById('srvstat');if(el){const s=STAT[st]||STAT.saved;el.className='srvstat s-'+s[1];el.textContent=s[0]}}
function srvSchedule(){
  if(SRV.conflict||!S)return;
  if(srvPayload()===SRV.lastSent&&!GRP.metaDirty){SRV.dirty=false;if(!SRV.saving)srvSetStatus('saved');return}
  SRV.dirty=true;srvSetStatus('pending');clearTimeout(SRV.timer);SRV.timer=setTimeout(()=>srvFlush(false),700);
}
async function srvFlush(force){
  clearTimeout(SRV.timer);clearTimeout(SRV.retryT);
  if(!S)return;
  if(SRV.saving){SRV.timer=setTimeout(()=>srvFlush(force),300);return}
  const p=srvPayload();
  if(p===SRV.lastSent&&!force&&!GRP.metaDirty){SRV.dirty=false;srvSetStatus('saved');return}
  SRV.saving=true;srvSetStatus('pending');
  // en un grupo, el punto de sincronización (base/seen) viaja JUNTO con el estado y se guarda en la misma operación
  const mv=GRP.metaVer,meta=GRP.on&&GRP.cl?{base:GRP.cl.base,seen:GRP.cl.seen,adopt:GRP.cl.adopt,epoch:GRP.cl.epoch}:undefined;
  let r;
  try{r=await api('PUT','state',{base_version:SRV.version,state:JSON.parse(p),force:!!force,grupo_meta:meta})}
  catch(e){SRV.saving=false;srvSetStatus('offline');SRV.retryT=setTimeout(()=>srvFlush(false),5000);return}
  SRV.saving=false;
  if(!S)return;   // se cerró la sesión mientras se guardaba
  if(r.ok){
    if(GRP.metaVer===mv)GRP.metaDirty=false;
    SRV.version=r.data.version;SRV.lastSent=p;SRV.conflict=null;hideLay();
    if(srvPayload()!==SRV.lastSent)srvSchedule();else{SRV.dirty=false;srvSetStatus('saved')}
    return;
  }
  if(r.status===409){SRV.conflict=r.data||{};srvSetStatus('conflict');srvShowConflict();return}
  if(r.status===401){srvSetStatus('login');srvShowLogin('Tu sesión venció. Entrá de nuevo: tus cambios se guardan apenas ingreses.');return}
  srvSetStatus('offline');SRV.retryT=setTimeout(()=>srvFlush(false),8000);
}
async function srvPoll(){
  if(!SRV.on||!S||SRV.saving||SRV.conflict||document.getElementById('srvlay'))return;
  let r;try{r=await api('GET','state/version')}catch(e){srvSetStatus('offline');return}
  if(r.status===401){srvSetStatus('login');srvShowLogin('Tu sesión venció. Entrá de nuevo.');return}
  if(!r.ok)return;
  if(SRV.saving||SRV.conflict||!S)return;   // mientras se esperaba la respuesta puede haber empezado un guardado propio
  if(SRV.status==='offline')srvSetStatus(SRV.dirty?'pending':'saved');
  if(r.data.version<=SRV.version)return;
  if(!SRV.dirty&&srvPayload()===SRV.lastSent){await srvReload(true)}
  else{
    let info={};try{const v=await api('GET','versions?limit=1');info=(v.data&&v.data.versions&&v.data.versions[0])||{}}catch(e){}
    if(SRV.saving||SRV.conflict||!S||r.data.version<=SRV.version)return;   // se resolvió solo mientras tanto (p. ej. era mi propio guardado)
    SRV.conflict={current_version:r.data.version,by:info.username,at:info.created_at};srvSetStatus('conflict');srvShowConflict();
  }
}
// Vuelve a pedir el estado al servidor (descarta lo local) y borra el historial de deshacer
async function srvReload(announce){
  const r=await api('GET','state');if(!r.ok||!r.data.state)return false;
  srvView();
  S=migrate(r.data.state);srvApplyView();hist=[];availDoc=null;
  SRV.version=r.data.version;SRV.lastSent=srvPayload();SRV.dirty=false;SRV.conflict=null;
  try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}
  if(GRP.on)await grpBoot();   // el punto de sincronización guardado en el servidor corresponde a ESTE estado: se vuelve a leer junto con él
  srvSetStatus('saved');hideLay();
  if(announce)msg=(r.data.by?r.data.by+' actualizó':'Se actualizó')+' el calendario (versión '+r.data.version+'). Se recargó solo; el historial de «Deshacer» se vació.';
  render();return true;
}
async function srvLoad(){
  const r=await api('GET','state');
  if(!r.ok)return false;
  if(!r.data.state){ // servidor vacío (instalación nueva): SIEMPRE calendario en blanco, nunca datos viejos guardados en el navegador
    const s=blankState();const d=new Date();s.year=d.getFullYear();s.month=d.getMonth();
    msg='Calendario nuevo y vacío. Empezá cargando a los médicos en la pestaña «Médicos» y después tocá «Reasignar automático».';
    S=s;srvApplyView();hist=[];SRV.version=0;SRV.lastSent='';render();await srvFlush(false);
  }else{
    S=migrate(r.data.state);srvApplyView();hist=[];SRV.version=r.data.version;SRV.lastSent=srvPayload();SRV.dirty=false;srvSetStatus('saved');
    if(!monthKeys(S).some(x=>S.assign[x]))msg='Este mes está vacío. Tocá «Reasignar automático» para armarlo.';
    render();
  }
  clearInterval(SRV.pollT);SRV.pollT=setInterval(srvPoll,20000);
  grpBoot();
  setTimeout(()=>{srvCheckUpdate(false)},2500);   // aviso de versión nueva (solo administrador; si no hay internet, no pasa nada)
  return true;

// La ventana de escritorio lo llama antes de cerrar: guarda lo pendiente y avisa cómo quedó ('ok' o el motivo)
async function srvPrepareClose(){
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}catch(e){}   // dispara el «change» de un campo a medio editar
  if(!SRV.on||!S)return 'ok';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  for(let i=0;i<110;i++){   // hasta ~11 s
    if(SRV.conflict)return 'conflict';
    if(SRV.status==='login')return 'login';
    if(!SRV.saving){
      if(srvPayload()===SRV.lastSent&&!SRV.dirty)return 'ok';
      await srvFlush(false);
      if(SRV.status==='offline'&&i>3)return 'offline';
    }else await wait(100);
  }
  return SRV.status==='saved'?'ok':SRV.status;
}

async function updInstall(){
  if(UPDGO.busy)return;UPDGO.busy=true;
  try{
    updLay('<h2>Preparando la actualización…</h2><div class="note">No cierres el calendario todavía.</div>');
    let r;try{r=await api('POST','actualizar',{actual:APP_VERSION})}catch(e){r=null}
    if(!r||!r.ok){updLayError('sin_conexion');return}
    for(let i=0;i<4000;i++){
      let g;try{g=await api('GET','actualizar')}catch(e){g=null}
      const st=g&&g.ok?g.data:null;
      if(st&&st.estado==='bajando'){updLay('<h2>Descargando la versión nueva…</h2><div class="updnov">'+st.pct+' %</div><div class="note">Puede tardar un minuto. Podés seguir mirando el calendario, pero no lo cierres.</div>')}
      else if(st&&st.estado==='error'){updLayError(st.error);return}
      else if(st&&st.estado==='listo'){
        const u=SRV.upd||{};
        if(window.chrome&&window.chrome.webview){
          updLay('<h2>Lista para instalar</h2><div class="updver">Versión '+esc(st.version||u.version||'')+'</div>'
            +'<div class="note">Para instalarla hay que cerrar el calendario: se guarda todo, se actualiza y se vuelve a abrir solo. <b>Tus guardias y tus datos no se tocan.</b></div>'
            +'<div class="row"><button class="pri" data-updcerrar="1">Cerrar y actualizar</button><button data-updclose="1">Más tarde</button></div>');
        }else{
          updLay('<h2>Descargada</h2><div class="note">Este calendario está abierto en un navegador, así que no puede actualizarse solo. Cerralo y abrí con doble clic el archivo <b>Instalar.exe</b> de esta carpeta:</div><div class="updnov" style="font-size:13px;word-break:break-all">'+esc(st.carpeta||'')+'</div>'
            +'<div class="row"><button data-updclose="1">Entendido</button></div>');
        }

      }

}

async function srvWipeRun(mode,pw){
  try{await srvFlush(false)}catch(e){}   // que la copia previa tenga lo último
  const cur=new Date();let st;
  if(mode==='guardias'){st=JSON.parse(JSON.stringify(S));st.assign={};st.locks={};st.splits={};st.ignored={};st.closed={}}
  else{st=blankState();st.year=cur.getFullYear();st.month=cur.getMonth()}
  let r;try{r=await api('POST','wipe',{password:pw,mode,state:st})}catch(e){return 'No hay conexión con el servidor.'}
  if(!r.ok)return (r.data&&r.data.error)||'No se pudo borrar.';
  const keepView={year:S.year,month:S.month};
  S=migrate(st);if(mode==='guardias'){S.year=keepView.year;S.month=keepView.month}
  SRV.version=r.data.version;SRV.lastSent=srvPayload();SRV.dirty=false;SRV.conflict=null;SRV.adm=null;hist=[];srvSetStatus('saved');
  if(mode!=='guardias'){try{localStorage.removeItem(STORE)}catch(e){}}
  tab=mode==='guardias'?'cal':'med';
  msg=mode==='guardias'?'Listo: se borraron todas las guardias. Los médicos y la configuración siguen.':'Listo: la base quedó en cero. Cargá los médicos en la pestaña «Médicos».';
  return true;
}

async function grpRound(){
  if(!GRP.on||GRP.busy||!S||!GRP.cl)return;
  if(SRV.conflict||SRV.status==='login'){grpNext();return}   // con un choque de guardado sin resolver o la sesión vencida, no se sincroniza (se retoma solo)
  const cl=GRP.cl;
  // esta ronda solo vale mientras siga siendo la misma configuración del grupo (si entretanto se recargó, salió o cerró sesión, se descarta)
  const vigente=()=>GRP.on&&GRP.cl===cl&&!!S;
  const io=async(m,p,b)=>vigente()?grpIo(m,p,b):{s:0,j:{}};
  const hooks={nom:cl.nom||SRV.user||'',getS:()=>S,commit:(s,c)=>{if(!vigente())return;if(s){S=s;hist=[];GRP.needRender=true}GRP.metaVer++;GRP.metaDirty=true;srvSchedule()}};
  const auto=GRP.autoNext;
  GRP.busy=true;grpSetStatus('sync');
  let r;try{r=await syncRound(cl,io,hooks,auto)}catch(e){r={status:'error',notes:[]}}
  GRP.busy=false;if(!vigente())return;
  if(auto&&r.status==='ok')GRP.autoNext=false;
  const st=r.status==='ok'?'ok':r.status;grpSetStatus(st);if(st==='ok')GRP.last=Date.now();
  GRP.fails=(st==='ok'||st==='esperando')?0:GRP.fails+1;
  const tx=grpNotesText(r.notes||[]);if(tx){msg=tx;GRP.needRender=true}
  else if(r.recibio&&!msg){msg='Se actualizó el calendario con cambios de otra persona.';GRP.needRender=true}
  grpRenderSoon();
  if(st==='quitada'||st==='sin_acceso'||st==='epoca'){clearTimeout(GRP.t);return}   // no hay nada que reintentar: hace falta una invitación nueva
  grpNext();
}

  const owner=GRP.cl&&GRP.cl.role==='owner';
  if(!confirm('¿Querés salir del grupo?\n\nSi tocás «Aceptar»: esta computadora deja de sincronizar y se queda con el calendario tal como está ahora. Las demás personas siguen en el grupo sin vos.\n'
    +(owner?'IMPORTANTE: vos administrás el grupo. Si salís, nadie más va a poder invitar ni quitar personas. Las demás siguen trabajando entre ellas.\n':'')
    +'Para volver a entrar vas a necesitar una invitación nueva (y el calendario se reemplaza por el del grupo).\nSi tocás «Cancelar»: no cambia nada.'))return;
  if(!owner&&GRP.cl){try{await api('POST','buzon',{method:'DELETE',path:'/groups/'+GRP.cl.g+'/members/me',token:GRP.cl.token})}catch(e){}}   // libera el lugar en el grupo (si no hay conexión, igual se sale de esta computadora)
  const r=await api('POST','grupo/salir',{});
  if(!r.ok){GRP.info=(r.data&&r.data.error)||'No pude salir del grupo.';render();return}
  grpStop();GRP.info='Saliste del grupo. Tu calendario quedó como estaba.';GRP.invite='';SRV.adm=null;render();
}
function grpCardHtml(){
  let h='<div class="card"><h3>Grupo</h3>';
  if(!GRP.on&&GRP.pending){
    h+='<div class="note">Entraste al grupo, pero falta terminar de guardarlo en esta computadora.</div><div class="row"><button class="pri" data-act="srv-grp-retry">Reintentar</button></div>';
  }else if(!GRP.on){
    h+='<div class="note">Para que varias personas trabajen en el <b>mismo calendario desde sus casas</b>, cada una con su computadora. Se pasan los cambios solas, y si alguien se queda sin internet, se pone al día cuando vuelve.</div>'
     +'<h4 style="margin:14px 0 4px">1. Soy la primera: quiero crear el grupo</h4>'
     +'<div class="note">Tu calendario de ahora pasa a ser el del grupo. Después invitás a las demás por WhatsApp.</div>'
     +'<div class="row"><button class="pri" data-act="srv-grp-create">Crear el grupo</button></div>'
     +'<h4 style="margin:18px 0 4px">2. Me invitaron: tengo un mensaje con un código</h4>'
     +'<label style="display:block">Pegá acá el mensaje (o solo el código) que te mandaron<textarea data-srv="grp-code" rows="3" style="width:100%;font-family:monospace" placeholder="GRD1.…">'+esc(GRP.draft)+'</textarea></label>'
     +'<div class="row"><button data-act="srv-grp-join">Unirme al grupo</button></div>'
     +'<div class="note">Antes de hacer cualquiera de las dos cosas te explico qué va a pasar con el calendario de esta computadora, y vas a poder cancelar.</div>';
  }else{
    const s=GRP_TXT[GRP.st]||GRP_TXT.idle,owner=GRP.cl&&GRP.cl.role==='owner';
    h+='<div class="shareok"><span class="pill '+(s[1]==='ok'?'ok':s[1]==='bad'?'bad':'neu')+'">'+esc(s[0])+'</span> '+esc(GRP_LARGO[GRP.st]||'')+'</div>'
     +'<div class="note" style="margin-top:6px">Esta computadora '+(owner?'<b>administra</b> el grupo.':'está en el grupo.')+(GRP.last?' Última vez al día: <b>'+esc(grpAgo(GRP.last))+'</b>.':'')+'</div>';
    if(owner){
      h+='<div class="row"><button class="pri" data-act="srv-grp-invite">Invitar a una persona</button></div>'
       +(GRP.invite?'<div class="sharelink"><textarea readonly id="grpinv" rows="5" style="width:100%" onclick="this.select()">'+esc(grpInviteMessage())+'</textarea></div><div class="row"><button class="pri" data-act="srv-grp-copy">Copiar mensaje para WhatsApp</button></div>'
         +'<div class="note">Pegalo en un chat de WhatsApp con esa persona. <b>La invitación vale 48 horas y se usa una sola vez.</b> Quien la reciba va a poder ver y editar el calendario completo: mandásela solo a quien corresponda.</div>':'')
       +'<div class="note">El grupo admite hasta 5 personas (con vos).</div>';
      if(GRP.members===null||GRP.members===undefined)grpLoadMembers();
      h+='<h4 style="margin:14px 0 6px">Personas del grupo</h4>';
      if(GRP.members===false)h+='<div class="note">No pude traer la lista ahora (revisá la conexión). <button class="mini" data-act="srv-grp-members">Reintentar</button></div>';
      else if(!GRP.members)h+='<div class="note">Cargando…</div>';
      else h+='<div class="calscroll"><table class="utab"><tr><th>Nombre</th><th></th><th>Último ingreso</th><th></th></tr>'
        +GRP.members.map(m=>'<tr><td><b>'+esc(m.nom||'(sin nombre)')+'</b>'+(m.yo?' <span class="note">(vos)</span>':'')+'</td><td>'+(m.role==='owner'?'<span class="pill ok">administra</span>':'')+'</td><td class="note">'+esc(m.yo?'ahora':grpAgo(m.seen))+'</td><td>'+(m.role==='owner'?'':'<button class="mini" data-act="srv-grp-remove" data-id="'+esc(m.id)+'" data-name="'+esc(m.nom)+'">Sacar del grupo</button>')+'</td></tr>').join('')
        +'</table></div><div class="row"><button class="mini" data-act="srv-grp-members">Actualizar lista</button></div><div class="note">«Sacar del grupo» corta su acceso al instante. Lo que ya tenía en su computadora no se puede borrar desde acá.</div>';
    }
    h+='<div class="row"><button data-act="srv-grp-leave">Salir del grupo</button></div>';
  }
  if(GRP.info)h+='<div class="note" style="margin-top:8px"><b>'+esc(GRP.info)+'</b></div>';
  return h+'</div>';
}

if(typeof document!=='undefined')init();
